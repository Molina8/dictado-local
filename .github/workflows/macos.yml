name: ci

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Tests
        run: python -m pytest -q

  build-mac:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'agent/macos')
    needs: test
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build .app + .dmg
        run: |
          chmod +x packaging/build_mac.sh
          packaging/build_mac.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DictadoLocal-macos-arm64
          path: |
            dist/DictadoLocal.app
            dist/*.dmg
      - name: Upload the .dmg to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/*.dmg --clobber