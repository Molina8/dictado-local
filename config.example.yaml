# Copia este fichero a %APPDATA%\dictado-local\config.yaml
# o pásalo con: python -m dictado --config config.yaml

hotkey: ctrl_r
sample_rate: 16000
min_record_ms: 300
max_record_s: 120
keep_mic_open: true
pre_roll_ms: 250
input_device: null

model: large-v3-turbo
model_fallback: small
# auto, cuda, cpu o mlx (mlx = Apple silicon con mlx-whisper)
device: auto
compute_type: auto
beam_size: 1
vad_filter: true
language: auto
model_dir: null

paste_restore_delay_ms: 450
append_space: false
indicator: true
# bottom-center, bottom-left, bottom-right o top-center
indicator_position: bottom-center
# cursor (monitor del ratón) o primary
indicator_monitor: cursor
# 1 es el tamaño normal. Vale de 0.6 a 2.
indicator_scale: 1.0
sound: true
history: true
start_with_windows: true
# true avisa si hay una version nueva. No instala nada.
check_updates: true
