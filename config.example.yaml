# Copia este fichero a %APPDATA%\dictado-local\config.yaml
# o pásalo con: python -m dictado --config config.yaml

hotkey: ctrl_r
sample_rate: 16000
min_record_ms: 300
max_record_s: 120
keep_mic_open: true
